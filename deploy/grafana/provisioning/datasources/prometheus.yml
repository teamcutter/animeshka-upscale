apiVersion: 1

# Business + HTTP metrics scraped by Prometheus (deploy/prometheus/prometheus.yml).
# Example queries:
#   rate(upscale_jobs_total[5m])
#   histogram_quantile(0.95, sum(rate(upscale_job_duration_seconds_bucket[5m])) by (le, mode))
#   histogram_quantile(0.5, sum(rate(upscale_megapixels_per_second_bucket[5m])) by (le, mode))
datasources:
  - name: Animeshka Prometheus
    uid: animeshka-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 15s
    isDefault: false
