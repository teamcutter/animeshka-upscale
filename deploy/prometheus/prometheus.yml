# Prometheus scrapes the API (/api/metrics) and the worker (:9101/metrics).
# Business metrics (upscale_jobs_total, upscale_job_duration_seconds,
# upscale_input_bytes, upscale_output_bytes, upscale_megapixels_per_second, ...)
# plus the HTTP metrics of the API are stored here and read back by Grafana.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: animeshka-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: animeshka-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
