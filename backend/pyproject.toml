
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animeshka-upscale"
version = "0.1.0"
description = "AI photo/video upscaler for vintage anime — dual Real-ESRGAN pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.128",
    "uvicorn>=0.40",
    "pydantic-settings==2.13.0",
    "pyyaml==6.0.3",
    "python-multipart>=0.0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "opencv-python-headless==4.13.0.90",
    "pillow==12.0.0",
    "numpy==2.1.1",
]

[project.scripts]
animeshka-upscale = "src.cli:main"
animeshka-worker = "src.worker:main"

# CUDA wheels only exist for x86_64; arm64 Linux (Docker on Apple Silicon) and macOS use PyPI (CPU/MPS).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and platform_machine == 'x86_64'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest==9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff==0.15.2",
    "ty==0.0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
no-matching-overload = "ignore"
unresolved-attribute = "ignore"
