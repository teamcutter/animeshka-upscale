app:
  host: 0.0.0.0
  port: 8000
upscale:
  backend: stub      # stub|realesrgan
  model_path: ./weights/upscale_model
  tile_size: 512
  device: auto       # auto|cuda|mps|cpu
  scale: 2
image:
  max_size_mb: 10
  max_width: 2048
  max_height: 2048
video:
  max_size_mb: 200
storage:
  dir: ./data
database:
  url: sqlite:///./data/animeshka.db   # postgresql://user:pass@host:5432/db
  auto_migrate: true
worker:
  embedded: true     # false -> run `python -m src.worker`
  poll_interval: 1.0
metrics:
  enabled: true      # API serves /api/metrics; the worker binds worker_port for Prometheus
  worker_port: 9101
auth:
  session_days: 30
  cookie_secure: false   # true behind HTTPS
log:
  level: INFO
