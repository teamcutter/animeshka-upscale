# docker compose up --build        -> UI :8080, API :8000, Grafana :3000, PostgreSQL :5432
# docker compose up -d postgres    -> only the database, run backend/frontend locally
# GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
name: animeshka

x-backend: &backend
  build: ./backend
  image: animeshka-backend:dev
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    DATABASE__URL: postgresql://animeshka:animeshka@postgres:5432/animeshka
    DATABASE__AUTO_MIGRATE: "false"
    WORKER__EMBEDDED: "false"
    STORAGE__DIR: /app/data
    UPSCALE__MODEL_PATH: /app/weights/upscale_model
  volumes:
    - ./backend/data:/app/data
    - ./backend/weights:/app/weights:ro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: animeshka
      POSTGRES_PASSWORD: animeshka
      POSTGRES_DB: animeshka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animeshka -d animeshka"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies Alembic migrations before api/worker start.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["python", "-m", "src.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # nginx with the built SPA; proxies /api and /health to `api`.
  frontend:
    build: ./frontend
    image: animeshka-frontend:dev
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  grafana:
