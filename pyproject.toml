[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "animeshka-upscale"
version = "0.1.0"
description = "AI photo/video upscaler for vintage anime — dual Real-ESRGAN pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic-settings==2.13.0",
    "pyyaml==6.0.3",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "opencv-python-headless==4.13.0.90",
    "pillow==12.0.0",
    "numpy==2.1.1",
]

[project.scripts]
animeshka-upscale = "src.cli:main"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff==0.15.2",
    "ty==0.0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
no-matching-overload = "ignore"
unresolved-attribute = "ignore"
